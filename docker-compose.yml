services:
  novel-translator:
    build:
      context: .
    environment:
      NOVEL_TRANSLATOR_DATA_DIR: /data
      NOVEL_TRANSLATOR_CONFIG_PATH: /data/config/translator_config.json
      NOVEL_TRANSLATOR_OUTPUT_ROOT: /data/output
    ports:
      - "8765:8765"
    volumes:
      - ./output:/data/output
      - ./translated:/data/translated
      - ./glossaries:/data/glossaries
      - ./logs:/data/logs
    restart: unless-stopped
